[package]
name = "ciel"
version = "1.2.0"
edition = "2021"
rust-version = "1.75"
description = "Ciel runtime binary — hot-path hook bodies and operator subcommands"
license = "MIT"
repository = "https://github.com/jxoesneon/Ciel"
homepage = "https://github.com/jxoesneon/Ciel"
keywords = ["agent", "runtime", "policy", "hooks", "safety"]
categories = ["command-line-utilities", "os::unix-apis"]
exclude = ["/target"]

[[bin]]
name = "ciel"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
regex = "1"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
fancy-regex = "0.19"
flate2 = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.11"
wait-timeout = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
